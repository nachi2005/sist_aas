<!DOCTYPE html>
<html>
<head>
    <title>Attendance</title>
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
    <h2>Attendance Records</h2>

    <div class="col-md-3">
    <a href="/attendance"
       class="btn btn-dark w-100 mb-3">
       Attendance
    </a>
</div>

    <table class="table table-bordered">
        <tr class="table-dark">
            <th>ID</th>
            <th>Name</th>
            <th>Roll No</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
        </tr>

        {% for r in records %}
        <tr>
            <td>{{ r[0] }}</td>
            <td>{{ r[1] }}</td>
            <td>{{ r[2] }}</td>
            <td>{{ r[3] }}</td>
            <td>{{ r[4] }}</td>
            <td>{{ r[5] }}</td>
        </tr>
        {% endfor %}
    </table>

    <a href="/dashboard" class="btn btn-primary">Back</a>
</div>

</body>
</html>
