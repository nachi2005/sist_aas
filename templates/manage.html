<!DOCTYPE html>
<html>
<head>
    <title>Manage Pass</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
    <h2>Manage Bus Pass</h2>

    <a href="/add_pass" class="btn btn-success mb-3">Add New Pass</a>

    <table class="table table-striped">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Roll No</th>
            <th>Action</th>
        </tr>

        {% for student in students %}
<tr>
    <td>{{ student[0] }}</td>
    <td>{{ student[1] }}</td>
    <td>{{ student[2] }}</td>
    <td>
        <a href="/update/{{ student[0] }}"
           class="btn btn-warning btn-sm">
           Update
        </a>
        <a href="/delete/{{ student[0] }}" class="btn btn-danger btn-sm">Delete</a>
    </td>
</tr>
{% endfor %}
    </table>
</div>

</body>
</html>
