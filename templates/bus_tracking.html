<!DOCTYPE html>
<html>
<head>
    <title>Bus Tracking</title>
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">
    <h2>Bus Tracking</h2>

    <form method="POST" class="mb-4">
        <input type="text" name="bus_no" class="form-control mb-2" placeholder="Bus No" required>
        <input type="text" name="route" class="form-control mb-2" placeholder="Route" required>
        <input type="text" name="location" class="form-control mb-2" placeholder="Current Location" required>
        <input type="text" name="status" class="form-control mb-2" placeholder="Status: On Time / Late" required>

        <button class="btn btn-primary">Update Bus</button>
    </form>

    <table class="table table-bordered">
        <tr>
            <th>ID</th>
            <th>Bus No</th>
            <th>Route</th>
            <th>Location</th>
            <th>Status</th>
        </tr>

        {% for bus in buses %}
        <tr>
            <td>{{ bus[0] }}</td>
            <td>{{ bus[1] }}</td>
            <td>{{ bus[2] }}</td>
            <td>{{ bus[3] }}</td>
            <td>{{ bus[4] }}</td>
        </tr>
        {% endfor %}
    </table>
</div>

</body>
</html>
