<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">SIST-AAS Dashboard</span>
    </div>
</nav>

<div class="container mt-4">

    <div class="row">
        <div class="col-md-3">
            <a href="/manage_pass" class="btn btn-primary w-100 mb-3">Manage Pass</a>
        </div>

        <div class="col-md-3">
            <a href="/scan" class="btn btn-success w-100 mb-3">Scan QR</a>
        </div>

        <div class="col-md-3">
            <a href="/attendance"class="btn btn-dark w-100 mb-3">Attendance</a>
        </div>

        <div class="col-md-3">
            <a href="/feedback" class="btn btn-warning w-100 mb-3">Feedback</a>
        </div>
        
        <div class="col-md-3">
            <a href="/bus_tracking"class="btn btn-info w-100 mb-3">Bus Tracking</a>
        </div>

        <div class="col-md-3">
             <a href="/view_feedback" class="btn btn-secondary w-100 mb-3">View Feedback</a>
        </div>

        <div class="col-md-3">
            <a href="/logout" class="btn btn-danger w-100 mb-3">Logout</a>
        </div>
    </div>

    <h3 class="mt-4">Recent Activity</h3>

    <table class="table table-bordered">
        <tr>
            <th>Name</th>
            <th>Time</th>
        </tr>

        {% for log in logs %}
        <tr>
            <td>{{ log[1] }}</td>
            <td>{{ log[2] }}</td>
        </tr>
        {% endfor %}
    </table>

</div>

</body>
</html>
